<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Bank Statement to CSV</title>
  <style>
    :root { font-family: Arial, sans-serif; }
    body { margin: 24px; max-width: 980px; }
    .dropzone {
      border: 2px dashed #888;
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
        position: relative;
    }
    .dropzone.dragover { background: #eef6ff; border-color: #1e73ff; }
    .row { margin-top: 14px; }
    textarea { width: 100%; min-height: 260px; font-family: Consolas, monospace; }
    button { padding: 10px 14px; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>PDF Bank Statement to CSV</h1>
  <p>Drop one or more statement PDFs below. The parser extracts lines that look like: <b>Date Description Amount [Balance]</b>.</p>

    <div id="dropzone" class="dropzone">
    <p><b>Drop PDF(s) here</b> or click to choose</p>
    <!-- Invisible native input overlays the dropzone so clicks reliably open the file chooser -->
    <input id="fileInput" type="file" accept="application/pdf" multiple style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;" />
    <small>No data leaves your machine. Processing is in-browser.</small>
  </div>
  <div style="margin-top:8px">
    <button id="chooseBtn">Choose file(s)</button>
  </div>

  <div class="row">
    <button id="downloadBtn" disabled>Download CSV</button>
    <span id="status" style="margin-left:10px;color:#333;"></span>
  </div>

  <div class="row">
    <label for="preview"><b>CSV Preview</b></label>
    <textarea id="preview" readonly></textarea>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    let latestCsv = '';
    let latestFileName = 'statement.csv';
    let latestPdfHandle = null;
    let outputDirectoryHandle = null;

    const pdfLibCandidates = [
      {
        lib: './lib/pdf.legacy.min.js',
        worker: './lib/pdf.legacy.worker.min.js'
      },
      {
        lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
        worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
      }
    ];

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensurePdfJsLoaded() {
      if (typeof window.pdfjsLib !== 'undefined') return true;

      for (const candidate of pdfLibCandidates) {
        try {
          await loadScript(candidate.lib);
          if (typeof window.pdfjsLib !== 'undefined') {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = candidate.worker;
            status.textContent = 'PDF library loaded. Select a PDF file.';
            return true;
          }
        } catch {
          // try next source
        }
      }

      status.textContent = 'Could not load PDF library. If this is a local file, keep the lib folder next to index.html.';
      return false;
    }

    status.textContent = 'Loading PDF library...';
    ensurePdfJsLoaded();

    // Prevent the browser from navigating to dropped files when user drops outside the dropzone
    window.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
    window.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); });

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async e => {
      const files = Array.from(e.target.files || []).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (files.length) {
        latestPdfHandle = null;
        status.textContent = `Selected ${files.length} file(s).`;
        await handleFiles(files.map(file => ({ file, handle: null })));
      }
      fileInput.value = '';
    });

    const chooseBtn = document.getElementById('chooseBtn');
    if (chooseBtn) {
      chooseBtn.addEventListener('click', async () => {
        const picked = await pickPdfsWithHandles();
        if (picked?.length) {
          await ensureOutputDirectoryHandle(picked[0].handle);
          status.textContent = `Selected ${picked.length} file(s).`;
          await handleFiles(picked);
          return;
        }
        fileInput.click();
      });
    }

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', async e => {
      const files = Array.from(e.dataTransfer?.files || []).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (files.length) {
        latestPdfHandle = null;
        status.textContent = `Dropped ${files.length} file(s).`;
        await handleFiles(files.map(file => ({ file, handle: null })));
      }
    });

    downloadBtn.addEventListener('click', async () => {
      if (!latestCsv) return;

      const savedToPdfFolder = await saveCsvNearSourcePdf(latestFileName, latestCsv);
      if (savedToPdfFolder) {
        status.textContent = `CSV saved as ${latestFileName} (same folder as the selected PDF).`;
      } else {
        downloadCsv(latestFileName, latestCsv);
        status.textContent = 'CSV downloaded.';
      }
    });

    async function handleFiles(entries) {
      if (!entries?.length) return;

      let converted = 0;
      let autoSavedCount = 0;
      let noRowsCount = 0;
      const totalsRows = [];

      for (let i = 0; i < entries.length; i++) {
        const entry = entries[i]?.file ? entries[i] : { file: entries[i], handle: null };
        if (entry.handle) latestPdfHandle = entry.handle;

        const result = await handleFile(entry.file, i + 1, entries.length);
        if (result.success) {
          converted++;
          if (result.autoSaved) autoSavedCount++;
          totalsRows.push({
            fileName: result.fileName,
            month: result.monthLabel,
            totalNegative: result.negativeTotal
          });
        } else if (result.noRows) {
          noRowsCount++;
        }
      }

      const totalsSaved = await saveTotalsCsvReport(totalsRows);
      if (entries.length > 1 || totalsRows.length) {
        const totalsPart = totalsRows.length ? (totalsSaved ? ' total.csv saved.' : ' total.csv downloaded.') : '';
        status.textContent = `Processed ${entries.length} file(s): ${converted} converted, ${noRowsCount} with no rows, ${autoSavedCount} auto-saved.${totalsPart}`;
      }
    }

    async function handleFile(file, currentIndex = 1, totalFiles = 1) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        alert('Please select a PDF file.');
        return { success: false, autoSaved: false, noRows: false };
      }

      if (typeof pdfjsLib === 'undefined') {
        const loaded = await ensurePdfJsLoaded();
        if (!loaded) {
          const msg = 'PDF library failed to load from all CDNs. Check network/proxy rules.';
          preview.value = msg;
          status.textContent = msg;
          return { success: false, autoSaved: false, noRows: false };
        }
      }

      latestFileName = file.name.replace(/\.pdf$/i, '') + '.csv';
      preview.value = `Reading PDF (${currentIndex}/${totalFiles})...`;
      status.textContent = `Reading ${file.name} (${currentIndex}/${totalFiles})...`;
      downloadBtn.disabled = true;
      latestCsv = '';

      try {
        const text = await extractTextFromPdf(file);
        const txnRows = toDateAmountDescriptionRows(toRawLineRows(text));

        if (!txnRows.length) {
          preview.value = `No Date/Amount/Description transaction rows were found for ${file.name}.`;
          status.textContent = `No matching transaction rows exported for ${file.name}.`;
          return { success: false, autoSaved: false, noRows: true };
        }

        const negativeTotal = sumNegativeAmounts(txnRows);
        const monthLabel = getFileMonthLabel(txnRows);
        latestCsv = toRawCsv(txnRows, negativeTotal, monthLabel);
        preview.value = latestCsv;

        const autoSaved = await autoSaveCsvToOutputDirectory(latestFileName, latestCsv);
        if (autoSaved) {
          status.textContent = `Exported ${txnRows.length} rows from ${file.name}. ${monthLabel} negative total: ${negativeTotal.toFixed(2)}. Auto-saved to PDF folder.`;
        } else {
          status.textContent = `Exported ${txnRows.length} rows from ${file.name}. ${monthLabel} negative total: ${negativeTotal.toFixed(2)}.`;
        }

        downloadBtn.disabled = false;
        return {
          success: true,
          autoSaved,
          noRows: false,
          fileName: file.name,
          monthLabel,
          negativeTotal
        };
      } catch (err) {
        console.error(err);
        const msg = `Failed to parse ${file.name}: ${err.message}`;
        preview.value = msg;
        status.textContent = msg;
        return { success: false, autoSaved: false, noRows: false };
      }
    }

    async function pickPdfsWithHandles() {
      if (typeof window.showOpenFilePicker !== 'function') return null;

      try {
        const handles = await window.showOpenFilePicker({
          multiple: true,
          types: [{
            description: 'PDF Files',
            accept: { 'application/pdf': ['.pdf'] }
          }]
        });

        if (!handles?.length) return null;

        const picked = [];
        for (const handle of handles) {
          const file = await handle.getFile();
          picked.push({ file, handle });
        }

        latestPdfHandle = picked[picked.length - 1].handle;
        return picked;
      } catch (err) {
        if (err?.name === 'AbortError') return null;
        return null;
      }
    }

    async function ensureOutputDirectoryHandle(startHandle) {
      if (typeof window.showDirectoryPicker !== 'function') return false;
      try {
        outputDirectoryHandle = await window.showDirectoryPicker({ mode: 'readwrite', startIn: startHandle || 'documents' });
        return !!outputDirectoryHandle;
      } catch {
        return false;
      }
    }

    async function autoSaveCsvToOutputDirectory(fileName, csvText) {
      if (!outputDirectoryHandle) return false;
      try {
        const fileHandle = await outputDirectoryHandle.getFileHandle(fileName, { create: true });
        const writable = await fileHandle.createWritable();
        await writable.write(csvText);
        await writable.close();
        return true;
      } catch {
        return false;
      }
    }

    async function saveCsvNearSourcePdf(fileName, csvText) {
      if (await autoSaveCsvToOutputDirectory(fileName, csvText)) return true;
      if (!latestPdfHandle || typeof window.showSaveFilePicker !== 'function') return false;

      try {
        const saveHandle = await window.showSaveFilePicker({
          suggestedName: fileName,
          startIn: latestPdfHandle,
          types: [{
            description: 'CSV Files',
            accept: { 'text/csv': ['.csv'] }
          }]
        });

        const writable = await saveHandle.createWritable();
        await writable.write(csvText);
        await writable.close();
        return true;
      } catch (err) {
        if (err?.name === 'AbortError') return false;
        return false;
      }
    }

    async function extractTextFromPdf(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

      const lines = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();

        const grouped = new Map();
        for (const item of content.items) {
          const y = Math.round(item.transform[5]);
          if (!grouped.has(y)) grouped.set(y, []);
          grouped.get(y).push(item);
        }

        const ys = [...grouped.keys()].sort((a, b) => b - a);
        for (const y of ys) {
          const row = grouped.get(y)
            .sort((a, b) => a.transform[4] - b.transform[4])
            .map(i => i.str)
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();
          if (row) lines.push(row);
        }
      }

      return lines.join('\n');
    }

    function extractTextBelowHeading(text, heading) {
      const lines = String(text || '').split(/\r?\n/);
      const headingLower = String(heading || '').toLowerCase();
      const idx = lines.findIndex(line => line.toLowerCase().includes(headingLower));
      if (idx === -1) return text;
      return lines.slice(idx + 1).join('\n');
    }

    function extractActivityDetailSection(text) {
      const lines = String(text || '').split(/\r?\n/);
      const startIdx = lines.findIndex(line => /activity\s+detail/i.test(line));
      if (startIdx === -1) return '';

      const stopHeaderRegex = /^(daily\s+balance\s+detail|account\s+messages|service\s+fees|checks\s+paid|check\s+image\s+service|overdraft|interest\s+paid|summary|balance\s+summary|ending\s+balance|average\s+ledger)/i;
      const out = [];
      for (let i = startIdx; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        if (i > startIdx && stopHeaderRegex.test(line)) break;
        out.push(line);
      }

      const merged = mergeContinuationLines(out);
      return merged.join('\n');
    }

    function mergeContinuationLines(lines) {
      const merged = [];
      const dateStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{2,4}|[A-Za-z]{3,9}\s+\d{1,2},\s*\d{4})\b/i;
      const nonTxnHeaderRegex = /^(activity\s+detail|date\s+description|date\s+amount|withdrawals?|deposits?|transfers?|checks?)/i;

      for (const raw of lines) {
        const line = String(raw || '').trim();
        if (!line) continue;

        const startsNewTxn = dateStartRegex.test(line) || nonTxnHeaderRegex.test(line);
        if (startsNewTxn || !merged.length) {
          merged.push(line);
          continue;
        }

        merged[merged.length - 1] = merged[merged.length - 1] + ' ' + line;
      }

      return merged;
    }

    function parseTransactions(text) {
      const rows = [];
      const lines = text.split(/\r?\n/);

      // Common statement date formats
      const datePart = '(?:\\d{1,2}[/-]\\d{1,2}(?:[/-]\\d{2,4})?|\\d{1,2}\\s+[A-Za-z]{3,9}\\s+\\d{2,4}|[A-Za-z]{3,9}\\s+\\d{1,2},\\s*\\d{4})';
      const amountPart = '(?:[-+]?\\$?\\d{1,3}(?:,\\d{3})*(?:\\.\\d{2})|\\(\\$?\\d{1,3}(?:,\\d{3})*(?:\\.\\d{2})\\))(?:\\s*(?:CR|DR))?';

      // Date Description Amount [Balance]
      const txnRegex = new RegExp(
        `^\\s*(${datePart})\\s+(.+?)\\s+(${amountPart})(?:\\s+(${amountPart}))?\\s*$`,
        'i'
      );

      for (const line of lines) {
        const m = line.match(txnRegex);
        if (!m) continue;

        const date = normalizeDate(m[1]);
        const description = m[2].trim();
        const amount = normalizeAmount(m[3]);
        const balance = m[4] ? normalizeAmount(m[4]) : '';

        rows.push({ date, description, amount, balance });
      }

      return rows;
    }

    function toRawLineRows(text) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => ({ line }));
    }

    function extractOnlyDepositTransferWithdrawalLines(text) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

      const targetHeaderRegex = /\b(deposits?|transfers?|withdrawals?)\b/i;
      const genericHeaderRegex = /^[A-Za-z][A-Za-z\s&/\-]{2,}$/;
      const dateStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{2,4}|[A-Za-z]{3,9}\s+\d{1,2},\s*\d{4})\b/i;
      const amountRegex = /[-(]?\$?\d{1,3}(?:,\d{3})*(?:\.\d{2})[)]?(?:\s*(?:CR|DR))?\b/i;

      const rows = [];
      let currentSection = '';

      for (const line of lines) {
        if (targetHeaderRegex.test(line)) {
          currentSection = line;
          rows.push({ section: currentSection, line: currentSection, kind: 'Title' });
          continue;
        }

        if (genericHeaderRegex.test(line) && !amountRegex.test(line) && !dateStartRegex.test(line)) {
          currentSection = '';
          continue;
        }

        if (!currentSection) continue;

        rows.push({ section: currentSection, line, kind: 'Entry' });
      }

      return rows;
    }

    function toDateAmountDescriptionRows(rows) {
      const out = [];
      const dateAtStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?)\b/;
      const amountRegexGlobal = /(?:\(?\$?(?:\d{1,3}(?:,\d{3})*|\d+)?\.\d{2}\)?(?:\s*(?:CR|DR))?)/gi;
      const stopOrNoiseRegex = /^(date\s+amount\s+description|date\s+description|date\s+debits?\s+credits?|activity\s+detail|performance\s+checking\s+statement|for\s+the\s+period|page\s+\d+\s+of\s+\d+|there\s+(?:was|were)\b|checks?\s+and\s+substitute\s+checks|check\s+number|reference\s+number|account\s+number|primary\s+account\s+number)/i;
      const newSectionHeaderRegex = /^[A-Za-z][A-Za-z\s/&\-]{6,}$/;

      for (const r of rows) {
        const line = (r?.line || '').trim();
        if (!line) continue;

        if (out.length && /^account\s+agreement\s+updates\b/i.test(line)) break;
        if (out.length && /^daily\s+balance\s+detail\b/i.test(line)) break;

        const dm = line.match(dateAtStartRegex);
        if (dm) {
          const date = normalizeDate(dm[1]);
          const rest = line.slice(dm[0].length).trim();
          const amountMatches = [...rest.matchAll(amountRegexGlobal)];

          if (amountMatches.length) {
            let amountText = '';
            let description = '';

            const first = amountMatches[0];
            const last = amountMatches[amountMatches.length - 1];
            const firstIndex = first.index ?? -1;
            const lastIndex = last.index ?? -1;

            if (firstIndex === 0) {
              amountText = first[0];
              description = rest.slice(first[0].length).trim();
            } else {
              amountText = last[0];
              description = rest.slice(0, lastIndex).trim();
            }

            if (description) {
              const cleanDescription = description.replace(/\s+/g, ' ').trim();
              const normalizedAmount = normalizeAmount(amountText);
              const signedAmount = applyAmountSign(normalizedAmount, cleanDescription);
              out.push({ date, amount: signedAmount, description: cleanDescription });
              continue;
            }
          }
        }

        if (!out.length) continue;
        if (stopOrNoiseRegex.test(line)) continue;
        if (newSectionHeaderRegex.test(line) && !/\d/.test(line)) continue;

        out[out.length - 1].description = (out[out.length - 1].description + ' ' + line).replace(/\s+/g, ' ').trim();
      }

      return out;
    }

    function toRawCsv(rows, negativeTotal = 0, monthLabel = 'Unknown') {
      const header = ['Date', 'Amount', 'Description'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.date),
          csvEscape(r.amount),
          csvEscape(r.description)
        ].join(','));
      }
      lines.push('');
      lines.push([
        csvEscape(`Total Negative (${monthLabel})`),
        csvEscape(negativeTotal.toFixed(2)),
        ''
      ].join(','));
      return lines.join('\n');
    }

    function toFilteredCsv(rows) {
      const header = ['Type', 'Section', 'Line'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.kind),
          csvEscape(r.section),
          csvEscape(r.line)
        ].join(','));
      }
      return lines.join('\n');
    }

    function normalizeAmount(v) {
      let s = String(v).trim().toUpperCase();
      const negByParens = s.startsWith('(') && s.endsWith(')');
      const hasDr = /\bDR\b/.test(s);
      const hasCr = /\bCR\b/.test(s);
      s = s.replace(/[,$()\s]|\bCR\b|\bDR\b/g, '');
      if ((negByParens || hasDr) && !s.startsWith('-')) s = '-' + s;
      if (hasCr && s.startsWith('-')) s = s.slice(1);
      return s;
    }

    function applyAmountSign(amount, description) {
      const amt = String(amount || '').trim();
      if (!amt) return amt;

      const desc = String(description || '').toLowerCase();
      const absAmt = amt.replace(/^-/, '');

      const transferHints = /transfer\s+(?:to|from)|online\s+transfer|zel\s+to|zel\s+from/i;
      const positiveHints = /(deposit|interest\s+payment|reimbursement|refund|credit)/i;
      const negativeHints = /(withdrawal|transaction\s+fee|fee\b|charge\b|web\s+pmt|\bpmt\b|payment|purchase|debit|bill\s+pay)/i;

      if (transferHints.test(desc)) return absAmt;
      if (positiveHints.test(desc)) return absAmt;
      if (negativeHints.test(desc)) return '-' + absAmt;
      return amt;
    }

    function sumNegativeAmounts(rows) {
      return rows.reduce((sum, row) => {
        const n = Number.parseFloat(String(row?.amount || '').replace(/,/g, ''));
        if (Number.isFinite(n) && n < 0) return sum + n;
        return sum;
      }, 0);
    }

    function getFileMonthLabel(rows) {
      const monthNames = [
        'january', 'february', 'march', 'april', 'may', 'june',
        'july', 'august', 'september', 'october', 'november', 'december'
      ];
      const counts = new Map();

      for (const row of rows || []) {
        const dateText = String(row?.date || '').trim();
        if (!dateText) continue;

        let label = '';
        const numeric = dateText.match(/^(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2,4}))?/);
        if (numeric) {
          const month = Number.parseInt(numeric[1], 10);
          if (month >= 1 && month <= 12) {
            const mm = String(month).padStart(2, '0');
            let year = numeric[3] ? String(numeric[3]) : '';
            if (year.length === 2) year = `20${year}`;
            label = year ? `${mm}-${year}` : mm;
          }
        }

        if (!label) {
          const named = dateText.match(/^([A-Za-z]{3,9})\s+\d{1,2},?\s*(\d{2,4})?/);
          if (named) {
            const monthPart = named[1].toLowerCase();
            const monthIndex = monthNames.findIndex(m => m.startsWith(monthPart));
            if (monthIndex >= 0) {
              const mm = String(monthIndex + 1).padStart(2, '0');
              let year = named[2] ? String(named[2]) : '';
              if (year.length === 2) year = `20${year}`;
              label = year ? `${mm}-${year}` : mm;
            }
          }
        }

        if (!label) continue;
        counts.set(label, (counts.get(label) || 0) + 1);
      }

      let bestLabel = 'Unknown';
      let bestCount = 0;
      for (const [label, count] of counts) {
        if (count > bestCount) {
          bestLabel = label;
          bestCount = count;
        }
      }

      return bestLabel;
    }

    function normalizeDate(v) {
      return String(v).replace(/\s+/g, ' ').trim();
    }

    function csvEscape(v) {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function toTotalsCsv(rows) {
      const lines = [['File', 'Month', 'Total Negative'].join(',')];
      for (const row of rows || []) {
        lines.push([
          csvEscape(row.fileName || ''),
          csvEscape(row.month || 'Unknown'),
          csvEscape(Number(row.totalNegative || 0).toFixed(2))
        ].join(','));
      }
      return lines.join('\n');
    }

    async function saveTotalsCsvReport(rows) {
      if (!rows?.length) return false;
      const csv = toTotalsCsv(rows);
      const fileName = 'total.csv';
      if (await autoSaveCsvToOutputDirectory(fileName, csv)) return true;
      downloadCsv(fileName, csv);
      return false;
    }

    function downloadCsv(fileName, csvText) {
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName || 'statement.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function toCsv(rows) {
      const header = ['Date', 'Description', 'Amount', 'Balance'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.date),
          csvEscape(r.description),
          csvEscape(r.amount),
          csvEscape(r.balance)
        ].join(','));
      }
      return lines.join('\n');
    }
  </script>
</body>
