<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Bank Statement to CSV</title>
  <style>
    :root { font-family: Arial, sans-serif; }
    body { margin: 24px; max-width: 980px; }
    .dropzone {
      border: 2px dashed #888;
      border-radius: 10px;
      padding: 28px;
      text-align: center;
      background: #fafafa;
      cursor: pointer;
        position: relative;
    }
    .dropzone.dragover { background: #eef6ff; border-color: #1e73ff; }
    .row { margin-top: 14px; }
    textarea { width: 100%; min-height: 260px; font-family: Consolas, monospace; }
    button { padding: 10px 14px; }
    small { color: #555; }
  </style>
</head>
<body>
  <h1>PDF Bank Statement to CSV</h1>
  <p>Drop a statement PDF below. The parser extracts lines that look like: <b>Date Description Amount [Balance]</b>.</p>

    <div id="dropzone" class="dropzone">
    <p><b>Drop PDF here</b> or click to choose</p>
    <!-- Invisible native input overlays the dropzone so clicks reliably open the file chooser -->
    <input id="fileInput" type="file" accept="application/pdf" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;" />
    <small>No data leaves your machine. Processing is in-browser.</small>
  </div>
  <div style="margin-top:8px">
    <button id="chooseBtn">Choose file</button>
  </div>

  <div class="row">
    <button id="downloadBtn" disabled>Download CSV</button>
    <span id="status" style="margin-left:10px;color:#333;"></span>
  </div>

  <div class="row">
    <label for="preview"><b>CSV Preview</b></label>
    <textarea id="preview" readonly></textarea>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');

    let latestCsv = '';
    let latestFileName = 'statement.csv';

    const pdfLibCandidates = [
      {
        lib: './lib/pdf.legacy.min.js',
        worker: './lib/pdf.legacy.worker.min.js'
      },
      {
        lib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
        worker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'
      }
    ];

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.async = true;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensurePdfJsLoaded() {
      if (typeof window.pdfjsLib !== 'undefined') return true;

      for (const candidate of pdfLibCandidates) {
        try {
          await loadScript(candidate.lib);
          if (typeof window.pdfjsLib !== 'undefined') {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = candidate.worker;
            status.textContent = 'PDF library loaded. Select a PDF file.';
            return true;
          }
        } catch {
          // try next source
        }
      }

      status.textContent = 'Could not load PDF library. If this is a local file, keep the lib folder next to index.html.';
      return false;
    }

    status.textContent = 'Loading PDF library...';
    ensurePdfJsLoaded();

    // Prevent the browser from navigating to dropped files when user drops outside the dropzone
    window.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); });
    window.addEventListener('drop', e => { e.preventDefault(); e.stopPropagation(); });

    dropzone.addEventListener('click', () => { console.log('dropzone clicked'); fileInput.click(); });
    fileInput.addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (file) {
        status.textContent = `Selected: ${file.name}`;
        handleFile(file);
      }
    });

    const chooseBtn = document.getElementById('chooseBtn');
    if (chooseBtn) chooseBtn.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(evt => {
      dropzone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(evt => {
      dropzone.addEventListener(evt, e => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', e => {
      const file = e.dataTransfer?.files?.[0];
      if (file) handleFile(file);
    });

    downloadBtn.addEventListener('click', () => {
      if (!latestCsv) return;
      downloadCsv(latestFileName, latestCsv);
      status.textContent = 'CSV downloaded.';
    });

    async function handleFile(file) {
      if (!file.name.toLowerCase().endsWith('.pdf')) {
        alert('Please select a PDF file.');
        return;
      }

      if (typeof pdfjsLib === 'undefined') {
        const loaded = await ensurePdfJsLoaded();
        if (!loaded) {
          const msg = 'PDF library failed to load from all CDNs. Check network/proxy rules.';
          preview.value = msg;
          status.textContent = msg;
          return;
        }
      }

      latestFileName = file.name.replace(/\.pdf$/i, '') + '.csv';
      preview.value = 'Reading PDF...';
      status.textContent = 'Reading PDF...';
      downloadBtn.disabled = true;
      latestCsv = '';

      try {
        const text = await extractTextFromPdf(file);
        const txnRows = toDateAmountDescriptionRows(toRawLineRows(text));

        if (!txnRows.length) {
          preview.value = 'No Date/Amount/Description transaction rows were found.';
          status.textContent = 'No matching transaction rows exported.';
          return;
        }

        latestCsv = toRawCsv(txnRows);
        preview.value = latestCsv;
        status.textContent = `Exported ${txnRows.length} transaction rows (Date, Amount, Description).`;

        downloadBtn.disabled = false;
        downloadCsv(latestFileName, latestCsv);
      } catch (err) {
        console.error(err);
        const msg = 'Failed to parse PDF: ' + err.message;
        preview.value = msg;
        status.textContent = msg;
      }
    }

    async function extractTextFromPdf(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

      const lines = [];
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();

        const grouped = new Map();
        for (const item of content.items) {
          const y = Math.round(item.transform[5]);
          if (!grouped.has(y)) grouped.set(y, []);
          grouped.get(y).push(item);
        }

        const ys = [...grouped.keys()].sort((a, b) => b - a);
        for (const y of ys) {
          const row = grouped.get(y)
            .sort((a, b) => a.transform[4] - b.transform[4])
            .map(i => i.str)
            .join(' ')
            .replace(/\s+/g, ' ')
            .trim();
          if (row) lines.push(row);
        }
      }

      return lines.join('\n');
    }

    function extractTextBelowHeading(text, heading) {
      const lines = String(text || '').split(/\r?\n/);
      const headingLower = String(heading || '').toLowerCase();
      const idx = lines.findIndex(line => line.toLowerCase().includes(headingLower));
      if (idx === -1) return text;
      return lines.slice(idx + 1).join('\n');
    }

    function extractActivityDetailSection(text) {
      const lines = String(text || '').split(/\r?\n/);
      const startIdx = lines.findIndex(line => /activity\s+detail/i.test(line));
      if (startIdx === -1) return '';

      const stopHeaderRegex = /^(daily\s+balance\s+detail|account\s+messages|service\s+fees|checks\s+paid|check\s+image\s+service|overdraft|interest\s+paid|summary|balance\s+summary|ending\s+balance|average\s+ledger)/i;
      const out = [];
      for (let i = startIdx; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        if (i > startIdx && stopHeaderRegex.test(line)) break;
        out.push(line);
      }

      const merged = mergeContinuationLines(out);
      return merged.join('\n');
    }

    function mergeContinuationLines(lines) {
      const merged = [];
      const dateStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{2,4}|[A-Za-z]{3,9}\s+\d{1,2},\s*\d{4})\b/i;
      const nonTxnHeaderRegex = /^(activity\s+detail|date\s+description|date\s+amount|withdrawals?|deposits?|transfers?|checks?)/i;

      for (const raw of lines) {
        const line = String(raw || '').trim();
        if (!line) continue;

        const startsNewTxn = dateStartRegex.test(line) || nonTxnHeaderRegex.test(line);
        if (startsNewTxn || !merged.length) {
          merged.push(line);
          continue;
        }

        merged[merged.length - 1] = merged[merged.length - 1] + ' ' + line;
      }

      return merged;
    }

    function parseTransactions(text) {
      const rows = [];
      const lines = text.split(/\r?\n/);

      // Common statement date formats
      const datePart = '(?:\\d{1,2}[/-]\\d{1,2}(?:[/-]\\d{2,4})?|\\d{1,2}\\s+[A-Za-z]{3,9}\\s+\\d{2,4}|[A-Za-z]{3,9}\\s+\\d{1,2},\\s*\\d{4})';
      const amountPart = '(?:[-+]?\\$?\\d{1,3}(?:,\\d{3})*(?:\\.\\d{2})|\\(\\$?\\d{1,3}(?:,\\d{3})*(?:\\.\\d{2})\\))(?:\\s*(?:CR|DR))?';

      // Date Description Amount [Balance]
      const txnRegex = new RegExp(
        `^\\s*(${datePart})\\s+(.+?)\\s+(${amountPart})(?:\\s+(${amountPart}))?\\s*$`,
        'i'
      );

      for (const line of lines) {
        const m = line.match(txnRegex);
        if (!m) continue;

        const date = normalizeDate(m[1]);
        const description = m[2].trim();
        const amount = normalizeAmount(m[3]);
        const balance = m[4] ? normalizeAmount(m[4]) : '';

        rows.push({ date, description, amount, balance });
      }

      return rows;
    }

    function toRawLineRows(text) {
      return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => ({ line }));
    }

    function extractOnlyDepositTransferWithdrawalLines(text) {
      const lines = String(text || '')
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0);

      const targetHeaderRegex = /\b(deposits?|transfers?|withdrawals?)\b/i;
      const genericHeaderRegex = /^[A-Za-z][A-Za-z\s&/\-]{2,}$/;
      const dateStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{2,4}|[A-Za-z]{3,9}\s+\d{1,2},\s*\d{4})\b/i;
      const amountRegex = /[-(]?\$?\d{1,3}(?:,\d{3})*(?:\.\d{2})[)]?(?:\s*(?:CR|DR))?\b/i;

      const rows = [];
      let currentSection = '';

      for (const line of lines) {
        if (targetHeaderRegex.test(line)) {
          currentSection = line;
          rows.push({ section: currentSection, line: currentSection, kind: 'Title' });
          continue;
        }

        if (genericHeaderRegex.test(line) && !amountRegex.test(line) && !dateStartRegex.test(line)) {
          currentSection = '';
          continue;
        }

        if (!currentSection) continue;

        rows.push({ section: currentSection, line, kind: 'Entry' });
      }

      return rows;
    }

    function toDateAmountDescriptionRows(rows) {
      const out = [];
      const dateAtStartRegex = /^(\d{1,2}[/-]\d{1,2}(?:[/-]\d{2,4})?)\b/;
      const amountRegexGlobal = /(?:\(?\$?(?:\d{1,3}(?:,\d{3})*|\d+)?\.\d{2}\)?(?:\s*(?:CR|DR))?)/gi;
      const stopOrNoiseRegex = /^(date\s+amount\s+description|date\s+description|date\s+debits?\s+credits?|activity\s+detail|performance\s+checking\s+statement|for\s+the\s+period|page\s+\d+\s+of\s+\d+|there\s+(?:was|were)\b|checks?\s+and\s+substitute\s+checks|check\s+number|reference\s+number|account\s+number|primary\s+account\s+number)/i;
      const newSectionHeaderRegex = /^[A-Za-z][A-Za-z\s/&\-]{6,}$/;

      for (const r of rows) {
        const line = (r?.line || '').trim();
        if (!line) continue;

        if (out.length && /^account\s+agreement\s+updates\b/i.test(line)) break;
        if (out.length && /^daily\s+balance\s+detail\b/i.test(line)) break;

        const dm = line.match(dateAtStartRegex);
        if (dm) {
          const date = normalizeDate(dm[1]);
          const rest = line.slice(dm[0].length).trim();
          const amountMatches = [...rest.matchAll(amountRegexGlobal)];

          if (amountMatches.length) {
            let amountText = '';
            let description = '';

            const first = amountMatches[0];
            const last = amountMatches[amountMatches.length - 1];
            const firstIndex = first.index ?? -1;
            const lastIndex = last.index ?? -1;

            if (firstIndex === 0) {
              amountText = first[0];
              description = rest.slice(first[0].length).trim();
            } else {
              amountText = last[0];
              description = rest.slice(0, lastIndex).trim();
            }

            if (description) {
              const cleanDescription = description.replace(/\s+/g, ' ').trim();
              const normalizedAmount = normalizeAmount(amountText);
              const signedAmount = applyAmountSign(normalizedAmount, cleanDescription);
              out.push({ date, amount: signedAmount, description: cleanDescription });
              continue;
            }
          }
        }

        if (!out.length) continue;
        if (stopOrNoiseRegex.test(line)) continue;
        if (newSectionHeaderRegex.test(line) && !/\d/.test(line)) continue;

        out[out.length - 1].description = (out[out.length - 1].description + ' ' + line).replace(/\s+/g, ' ').trim();
      }

      return out;
    }

    function toRawCsv(rows) {
      const header = ['Date', 'Amount', 'Description'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.date),
          csvEscape(r.amount),
          csvEscape(r.description)
        ].join(','));
      }
      return lines.join('\n');
    }

    function toFilteredCsv(rows) {
      const header = ['Type', 'Section', 'Line'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.kind),
          csvEscape(r.section),
          csvEscape(r.line)
        ].join(','));
      }
      return lines.join('\n');
    }

    function normalizeAmount(v) {
      let s = String(v).trim().toUpperCase();
      const negByParens = s.startsWith('(') && s.endsWith(')');
      const hasDr = /\bDR\b/.test(s);
      const hasCr = /\bCR\b/.test(s);
      s = s.replace(/[,$()\s]|\bCR\b|\bDR\b/g, '');
      if ((negByParens || hasDr) && !s.startsWith('-')) s = '-' + s;
      if (hasCr && s.startsWith('-')) s = s.slice(1);
      return s;
    }

    function applyAmountSign(amount, description) {
      const amt = String(amount || '').trim();
      if (!amt) return amt;

      const desc = String(description || '').toLowerCase();
      const absAmt = amt.replace(/^-/, '');

      const transferHints = /transfer\s+(?:to|from)|online\s+transfer|zel\s+to|zel\s+from/i;
      const positiveHints = /(deposit|interest\s+payment|reimbursement|refund|credit)/i;
      const negativeHints = /(withdrawal|transaction\s+fee|fee\b|charge\b|web\s+pmt|payment|purchase|debit|bill\s+pay)/i;

      if (transferHints.test(desc)) return absAmt;
      if (positiveHints.test(desc)) return absAmt;
      if (negativeHints.test(desc)) return '-' + absAmt;
      return amt;
    }

    function normalizeDate(v) {
      return String(v).replace(/\s+/g, ' ').trim();
    }

    function csvEscape(v) {
      const s = String(v ?? '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function downloadCsv(fileName, csvText) {
      const blob = new Blob([csvText], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName || 'statement.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function toCsv(rows) {
      const header = ['Date', 'Description', 'Amount', 'Balance'];
      const lines = [header.join(',')];
      for (const r of rows) {
        lines.push([
          csvEscape(r.date),
          csvEscape(r.description),
          csvEscape(r.amount),
          csvEscape(r.balance)
        ].join(','));
      }
      return lines.join('\n');
    }
  </script>
</body>
</html>
